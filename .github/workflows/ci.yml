name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (build, test, .deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-multimedia-dev qt6-base-dev-tools \
            libgl1-mesa-dev \
            libmp3lame-dev libsndfile1-dev libebur128-dev \
            xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSANITY_WITH_GUI=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (unit, end-to-end, GUI under xvfb)
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB

      - name: Smoke test the installed payload
        run: |
          mkdir -p /tmp/payload
          dpkg-deb -x build/*.deb /tmp/payload
          /tmp/payload/usr/bin/podcast-sanity-render --gen-corpus /tmp/c.wav \
            --profile home --seconds 8 --quiet
          /tmp/payload/usr/bin/podcast-sanity-render /tmp/c.wav --out /tmp/m.wav \
            --power-clean --filler cautious --summary

      - uses: actions/upload-artifact@v4
        with:
          name: podcast-sanity-deb
          path: build/*.deb

  sanitizers:
    name: Linux (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libsndfile1-dev libmp3lame-dev
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DSANITY_WITH_GUI=OFF \
                -DCMAKE_BUILD_TYPE=Debug -DSANITY_SANITIZE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -R "unit|e2e"

  windows:
    name: Windows (build, test, MSI)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtmultimedia'
          cache: true

      - name: Install WiX and codec libraries
        run: |
          choco install wixtoolset --no-progress -y
          echo "WIX=$env:WIX" >> $env:GITHUB_ENV
          vcpkg install libmp3lame libsndfile --triplet x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_BUILD_TYPE=Release -DSANITY_WITH_GUI=ON -DSANITY_WITH_EBUR128=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package MSI
        run: cd build && cpack -G WIX -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: podcast-sanity-msi
          path: build/*.msi
